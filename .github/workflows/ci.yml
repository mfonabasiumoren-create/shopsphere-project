name: ShopSphere CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and build


    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: TestRoot_84!
          MYSQL_DATABASE: shopsphere_test
          MYSQL_USER: shopsphere_test_user
          MYSQL_PASSWORD: ShopTest_84!
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pTestRoot_84!"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10



    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install application and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt PyYAML

      - name: Compile Python application
        run: python -m py_compile app/app.py


      - name: Initialize test database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3307"
          DB_NAME: shopsphere_test
          DB_USER: shopsphere_test_user
          DB_PASSWORD: ShopTest_84!
        run: |
          python - <<'PY'
          import os
          import pymysql

          connection = pymysql.connect(
              host=os.environ["DB_HOST"],
              port=int(os.environ["DB_PORT"]),
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"],
              database=os.environ["DB_NAME"],
          )

          try:
              with connection.cursor() as cursor:
                  with open("app/database/init.sql", encoding="utf-8") as file:
                      statements = file.read().split(";")

                  for statement in statements:
                      if statement.strip():
                          cursor.execute(statement)

              connection.commit()
          finally:
              connection.close()

          print("Test database initialized successfully.")
          PY

      - name: Validate database schema
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3307"
          DB_NAME: shopsphere_test
          DB_USER: shopsphere_test_user
          DB_PASSWORD: ShopTest_84!
        run: python tests/validate_database_schema.py

      - name: Run automated API tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_NAME: shopsphere_test
          DB_USER: shopsphere_test_user
          DB_PASSWORD: ShopTest_84!
        run: python -m unittest discover -s tests -v

      - name: Validate Kubernetes YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path("kubernetes").glob("*.yaml"))

          for path in files:
              if path.name == "rendered.yaml":
                  continue

              with path.open(encoding="utf-8") as stream:
                  list(yaml.safe_load_all(stream))

              print(f"Validated {path}")
          PY

      - name: Build Docker image
        run: docker build --tag shopsphere-api:ci ./app
