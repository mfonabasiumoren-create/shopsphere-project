apiVersion: apps/v1
kind: Deployment

metadata:
  name: shopsphere-api
  labels:
    app: shopsphere-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shopsphere-api

  template:
    metadata:
      labels:
        app: shopsphere-api

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000

      terminationGracePeriodSeconds: 30
            
      containers:
        - name: shopsphere-api
          securityContext:
            readOnlyRootFilesystem: true
          image: 181040157383.dkr.ecr.us-east-1.amazonaws.com/shopsphere-api:v1

          envFrom:
            - configMapRef:
                name: shopsphere-api-config

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
